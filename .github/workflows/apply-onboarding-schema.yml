name: Apply Onboarding Schema

on:
  push:
    branches:
      - feat/tenant-onboarding-wizard
    paths:
      - scripts/apply-onboarding-schema.mjs
      - .github/workflows/apply-onboarding-schema.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tenant-onboarding-wizard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply onboarding schema
        run: node scripts/apply-onboarding-schema.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(onboarding): add resumable onboarding data model"
          git push origin HEAD:feat/tenant-onboarding-wizard
