name: Apply Documentation Lint Fixes

on:
  push:
    branches:
      - feat/complete-documentation-module
    paths:
      - scripts/fix-documentation-lint.mjs
      - .github/workflows/fix-documentation-lint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-documentation-module
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lint fixes
        run: node scripts/fix-documentation-lint.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy documentation operations lint"
          git push origin HEAD:feat/complete-documentation-module
