name: Payroll Effective Compensation Patch

on:
  push:
    branches:
      - feat/payroll-effective-compensation-v2-20260824
    paths:
      - scripts/apply-payroll-effective-compensation.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payroll-effective-compensation-v2-20260824
          fetch-depth: 0
      - name: Apply effective compensation implementation
        run: python3 scripts/apply-payroll-effective-compensation.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(payroll): persist effective-dated employee compensation"
          git push origin HEAD:feat/payroll-effective-compensation-v2-20260824
