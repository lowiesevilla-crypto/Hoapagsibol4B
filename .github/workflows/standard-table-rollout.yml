name: One-time StandardTable rollout

on:
  push:
    branches: [release/standard-table-org-main-safe]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/standard-table-org-main-safe
          fetch-depth: 0
      - name: Apply StandardTable wrappers
        run: node scripts/apply-standard-table-wrapper.mjs
      - name: Commit rollout
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- app components; then
            echo "No StandardTable rollout changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "refactor(ui): standardize current-main data tables"
          git push origin HEAD:release/standard-table-org-main-safe
