name: HOAHub Edge Critical Flow

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: hoa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-critical-flow:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hoa_portal
          MYSQL_USER: hoa_app
          MYSQL_PASSWORD: hoa_ci_password
          MYSQL_ROOT_PASSWORD: hoa_ci_root_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -phoa_ci_root_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://hoa_app:hoa_ci_password@127.0.0.1:3306/hoa_portal
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3000/api
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      CRON_SECRET: ci-only-cron-secret-with-at-least-32-characters
      STORAGE_ROOT: /tmp/hoahub-storage
      SEED_SYSTEM_ADMIN_EMAIL: ci-system@example.invalid
      SEED_SYSTEM_ADMIN_PASSWORD: CI-Temporary-Password-2026!
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_COVERAGE_YEAR: "2099"
      E2E_COVERAGE_MONTH: "1"
      AI_RUNTIME_ENABLED: "true"
      AI_PROVIDER_MODE: mock
      HOAHUB_E2E_BROWSER: edge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm build
      - name: Require Microsoft Edge
        shell: bash
        run: |
          set -Eeuo pipefail
          EDGE_PATH="$(command -v microsoft-edge-stable || command -v microsoft-edge || true)"
          if [ -z "$EDGE_PATH" ] || [ ! -x "$EDGE_PATH" ]; then
            echo "::error::Microsoft Edge is not installed on this GitHub-hosted runner. Refusing Chromium fallback because it would not prove Edge compatibility."
            exit 1
          fi
          echo "EDGE_BIN=$EDGE_PATH" >> "$GITHUB_ENV"
          "$EDGE_PATH" --version
      - name: Run non-destructive Edge critical-flow evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm e2e:prepare
          pnpm start > /tmp/hoa-edge-next.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            pnpm e2e:cleanup || true
            echo "--- HOAHub Edge server log ---"
            cat /tmp/hoa-edge-next.log || true
          }
          trap cleanup EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          node --import ./tests/e2e/safe-browser-context-cleanup.mjs tests/e2e/wcag-critical-flow.mjs
