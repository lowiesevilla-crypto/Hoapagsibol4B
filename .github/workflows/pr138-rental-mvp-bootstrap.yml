              prisma.rentalInvoice.findMany({ where: { tenantId: user.tenantId }, include: { agreement: { include: { asset: true, renter: true } }, allocations: { include: { collection: true } } }, orderBy: [{ dueDate: "desc" }, { createdAt: "desc" }] }),
              prisma.collection.findMany({ where: { tenantId: user.tenantId, type: "OTHER", refundable: false }, include: { rentalAllocations: true }, orderBy: [{ collectionDate: "desc" }, { createdAt: "desc" }] }),
              prisma.rentalPaymentAllocation.findMany({ where: { tenantId: user.tenantId }, include: { invoice: { include: { agreement: { include: { renter: true, asset: true } } } }, collection: true }, orderBy: { createdAt: "desc" }, take: 20 }),
            ]);

            const today = new Date();
