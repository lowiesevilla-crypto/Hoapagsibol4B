name: Update PR 51 activation browser coverage

on:
  push:
    branches:
      - enhancement/homeowner-multi-account-activation
    paths:
      - .github/workflows/fix-pr51-activation-e2e.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement/homeowner-multi-account-activation
          fetch-depth: 0
      - name: Patch browser test
        run: echo '' | base64 -d | python
      - name: Commit browser test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/critical-path.mjs .github/workflows/fix-pr51-activation-e2e.yml
          git diff --cached --check
          git commit -m "test: follow secure homeowner activation handoff"
          git push origin HEAD:enhancement/homeowner-multi-account-activation
