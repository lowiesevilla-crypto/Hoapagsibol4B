name: PR139 Rental Accounting and Search Hotfix

on:
  push:
    branches:
      - fix/rental-report-search-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rental-report-search-ux
          fetch-depth: 0

      - name: Apply hotfix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          # Shared accounting helper: a refundable rental security deposit is cash received,
          # but not recognized income. Only the amount actually allocated to a deposit invoice
          # is carved out, so mixed/partial receipts remain arithmetically correct.
          Path("lib/rental-accounting.ts").write_text('''export type RentalAccountingAllocation = {\n  collectionId: string;\n  amount: unknown;\n  chargeType: string;\n};\n\nexport function summarizeRentalSecurityDeposits(rows: RentalAccountingAllocation[]) {\n  const byCollection = new Map<string, number>();\n  let total = 0;\n  for (const row of rows) {\n    if (row.chargeType !== "SECURITY_DEPOSIT") continue;\n    const amount = Number(row.amount);\n    if (!Number.isFinite(amount) || amount <= 0) continue;\n    byCollection.set(row.collectionId, (byCollection.get(row.collectionId) ?? 0) + amount);\n    total += amount;\n  }\n  return { byCollection, total };\n}\n\nexport function recognizedCollectionAmount(amount: unknown, depositAllocated: number) {\n  const cash = Number(amount);\n  if (!Number.isFinite(cash) || cash <= 0) return 0;\n  return Math.max(0, cash - Math.min(cash, Math.max(0, depositAllocated)));\n}\n''')

          # Web financial report.
          replace_once(
              "app/admin/reports/page.tsx",
              'import { paymentAllocationCoverageLabel } from "@/lib/payment-coverage";\n',
              'import { paymentAllocationCoverageLabel } from "@/lib/payment-coverage";\nimport { recognizedCollectionAmount, summarizeRentalSecurityDeposits } from "@/lib/rental-accounting";\n'
          )
          replace_once(
              "app/admin/reports/page.tsx",
              'const [payments, collections, refunds, expenses, payrolls, employeeLoanIssuances, employeeLoanRepaymentRows, allEmployeeLoanTotals, employeeLoanBalances, billSummary, statusCounts, monthly, allBondTotals] = await Promise.all([',
              'const [payments, collections, refunds, expenses, payrolls, employeeLoanIssuances, employeeLoanRepaymentRows, allEmployeeLoanTotals, employeeLoanBalances, billSummary, statusCounts, monthly, allBondTotals, rentalAllocations] = await Promise.all(['
          )
          replace_once(
              "app/admin/reports/page.tsx",
              '    prisma.collection.aggregate({ _sum: { amount: true, amountRefunded: true, amountForfeited: true }, where: { refundable: true } }),\n  ]);',
              '    prisma.collection.aggregate({ _sum: { amount: true, amountRefunded: true, amountForfeited: true }, where: { refundable: true } }),\n    prisma.rentalPaymentAllocation.findMany({ where: { collection: { collectionDate: range } }, include: { invoice: true }, take: 5000 }),\n  ]);'
          )
          replace_once(
              "app/admin/reports/page.tsx",
              '  const feeCollections = collections.filter((item) => !item.refundable && item.collectionDate >= from && item.collectionDate <= to);\n  const feeIncome = feeCollections.reduce((sum, item) => sum + Number(item.amount), 0);',
              '  const feeCollections = collections.filter((item) => !item.refundable && item.collectionDate >= from && item.collectionDate <= to);\n  const rentalDepositSummary = summarizeRentalSecurityDeposits(rentalAllocations.map((item) => ({ collectionId: item.collectionId, amount: item.amount, chargeType: item.invoice.chargeType })));\n  const rentalSecurityDepositsReceived = rentalDepositSummary.total;\n  const feeIncome = feeCollections.reduce((sum, item) => sum + recognizedCollectionAmount(item.amount, rentalDepositSummary.byCollection.get(item.id) ?? 0), 0);'
          )
          replace_once(
              "app/admin/reports/page.tsx",
              '  const cashInflows = paymentCashReceived + feeIncome + bondsReceived;',
              '  const cashInflows = paymentCashReceived + feeIncome + rentalSecurityDepositsReceived + bondsReceived;'
          )
          replace_once(
              "app/admin/reports/page.tsx",
              '  for (const item of feeCollections) feeBreakdown.set(collectionLabel(item.type, item.description), (feeBreakdown.get(collectionLabel(item.type, item.description)) ?? 0) + Number(item.amount));',
              '  for (const item of feeCollections) { const value = recognizedCollectionAmount(item.amount, rentalDepositSummary.byCollection.get(item.id) ?? 0); if (value > 0) feeBreakdown.set(collectionLabel(item.type, item.description), (feeBreakdown.get(collectionLabel(item.type, item.description)) ?? 0) + value); }'
          )
          replace_once(
              "app/admin/reports/page.tsx",
              '<Row label="Monthly dues cash received" value={paymentCashReceived} /><Row label="Other fee collections" value={feeIncome} /><Row label="Refundable bonds received" value={bondsReceived} /><Row label="Total cash receipts" value={cashInflows} total />',
              '<Row label="Monthly dues cash received" value={paymentCashReceived} /><Row label="Other fee collections" value={feeIncome} /><Row label="Rental security deposits received (liability)" value={rentalSecurityDepositsReceived} /><Row label="Refundable bonds received" value={bondsReceived} /><Row label="Total cash receipts" value={cashInflows} total />'
          )

          # Shared PDF/DOCX financial report service.
          replace_once(
              "lib/services/financial-report.ts",
              'import { paymentAllocationCoverageLabel } from "@/lib/payment-coverage";\n',
              'import { paymentAllocationCoverageLabel } from "@/lib/payment-coverage";\nimport { recognizedCollectionAmount, summarizeRentalSecurityDeposits } from "@/lib/rental-accounting";\n'
          )
          replace_once(
              "lib/services/financial-report.ts",
              'const [payments, collections, refunds, expenses, payrolls, employeeLoanIssuances, employeeLoanRepaymentRowsRaw, allEmployeeLoanTotals, billSummary, statusCounts, allBondTotals] = await Promise.all([',
              'const [payments, collections, refunds, expenses, payrolls, employeeLoanIssuances, employeeLoanRepaymentRowsRaw, allEmployeeLoanTotals, billSummary, statusCounts, allBondTotals, rentalAllocations] = await Promise.all(['
          )
          replace_once(
              "lib/services/financial-report.ts",
              '    prisma.collection.aggregate({ _sum: { amount: true, amountRefunded: true, amountForfeited: true }, where: { refundable: true } }),\n  ]);',
              '    prisma.collection.aggregate({ _sum: { amount: true, amountRefunded: true, amountForfeited: true }, where: { refundable: true } }),\n    prisma.rentalPaymentAllocation.findMany({ where: { collection: { collectionDate: range } }, include: { invoice: true }, take: 5000 }),\n  ]);'
          )
          replace_once(
              "lib/services/financial-report.ts",
              '  const feeCollections = collections.filter((item) => !item.refundable && item.collectionDate >= from && item.collectionDate <= to);\n  const feeIncome = feeCollections.reduce((sum, item) => sum + Number(item.amount), 0);',
              '  const feeCollections = collections.filter((item) => !item.refundable && item.collectionDate >= from && item.collectionDate <= to);\n  const rentalDepositSummary = summarizeRentalSecurityDeposits(rentalAllocations.map((item) => ({ collectionId: item.collectionId, amount: item.amount, chargeType: item.invoice.chargeType })));\n  const rentalSecurityDepositsReceived = rentalDepositSummary.total;\n  const feeIncome = feeCollections.reduce((sum, item) => sum + recognizedCollectionAmount(item.amount, rentalDepositSummary.byCollection.get(item.id) ?? 0), 0);'
          )
          replace_once(
              "lib/services/financial-report.ts",
              '  const cashInflows = paymentCashReceived + feeIncome + bondsReceived;',
              '  const cashInflows = paymentCashReceived + feeIncome + rentalSecurityDepositsReceived + bondsReceived;'
          )
          replace_once(
              "lib/services/financial-report.ts",
              '  for (const item of feeCollections) feeMap.set(collectionLabel(item.type, item.description), (feeMap.get(collectionLabel(item.type, item.description)) ?? 0) + Number(item.amount));',
              '  for (const item of feeCollections) { const value = recognizedCollectionAmount(item.amount, rentalDepositSummary.byCollection.get(item.id) ?? 0); if (value > 0) feeMap.set(collectionLabel(item.type, item.description), (feeMap.get(collectionLabel(item.type, item.description)) ?? 0) + value); }'
          )
          replace_once(
              "lib/services/financial-report.ts",
              '    duesIncome, paymentCashReceived, unappliedCredits, feeIncome, forfeitedIncome, recognizedIncome,',
              '    duesIncome, paymentCashReceived, unappliedCredits, feeIncome, rentalSecurityDepositsReceived, forfeitedIncome, recognizedIncome,'
          )

          # Keep generated PDF and Word statements aligned with web accounting.
          replace_once(
              "app/admin/reports/pdf/route.ts",
              '  row("Other fee collections", report.feeIncome);\n  row("Refundable bonds received", report.bondsReceived);',
              '  row("Other fee collections", report.feeIncome);\n  row("Rental security deposits received (liability)", report.rentalSecurityDepositsReceived);\n  row("Refundable bonds received", report.bondsReceived);'
          )
          replace_once(
              "app/admin/reports/docx/route.ts",
              '["Monthly dues cash received", report.paymentCashReceived], ["Other fee collections", report.feeIncome], ["Refundable bonds received", report.bondsReceived], ["Total cash receipts", report.cashInflows, true],',
              '["Monthly dues cash received", report.paymentCashReceived], ["Other fee collections", report.feeIncome], ["Rental security deposits received (liability)", report.rentalSecurityDepositsReceived], ["Refundable bonds received", report.bondsReceived], ["Total cash receipts", report.cashInflows, true],'
          )

          # Rental page search UX and payer-safe receipt filtering.
          replace_once(
              "app/admin/rentals/page.tsx",
              'import { PageHeader } from "@/components/page-header";\n',
              'import { PageHeader } from "@/components/page-header";\nimport { SearchableSelect } from "@/components/searchable-select";\n'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              'type InvoiceRow = { id: string; invoiceNumber: string; chargeType: string; periodStart: Date; periodEnd: Date; dueDate: Date; amount: Prisma.Decimal | number | string; amountPaid: Prisma.Decimal | number | string; balance: Prisma.Decimal | number | string; status: string; assetCode: string; assetName: string; renterName: string };',
              'type InvoiceRow = { id: string; invoiceNumber: string; chargeType: string; periodStart: Date; periodEnd: Date; dueDate: Date; amount: Prisma.Decimal | number | string; amountPaid: Prisma.Decimal | number | string; balance: Prisma.Decimal | number | string; status: string; assetCode: string; assetName: string; renterName: string; renterHomeownerId: string | null };'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              'type CollectionRow = { id: string; receiptNumber: string; payerName: string; amount: Prisma.Decimal | number | string; allocated: Prisma.Decimal | number | string; available: Prisma.Decimal | number | string };',
              'type CollectionRow = { id: string; receiptNumber: string; payerType: string; payerName: string | null; homeownerId: string | null; amount: Prisma.Decimal | number | string; allocated: Prisma.Decimal | number | string; available: Prisma.Decimal | number | string };'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              '        ra.code AS assetCode,ra.name AS assetName,r.fullName AS renterName\n',
              '        ra.code AS assetCode,ra.name AS assetName,r.fullName AS renterName,r.homeownerId AS renterHomeownerId\n'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              '      SELECT c.id,c.receiptNumber,COALESCE(c.payerName,u.name,\'Unknown payer\') AS payerName,c.amount,',
              '      SELECT c.id,c.receiptNumber,c.payerType,c.payerName,c.homeownerId,c.amount,'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              '      GROUP BY c.id,c.receiptNumber,c.payerName,u.name,c.amount HAVING available>0 ORDER BY c.collectionDate DESC LIMIT 200',
              '      GROUP BY c.id,c.receiptNumber,c.payerType,c.payerName,c.homeownerId,c.amount HAVING available>0 ORDER BY c.collectionDate DESC LIMIT 5000'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              '    prisma.homeownerProfile.findMany({ where: { tenantId: admin.tenantId, status: "ACTIVE" }, include: { user: true }, orderBy: { user: { name: "asc" } }, take: 500 }),',
              '    prisma.homeownerProfile.findMany({ where: { tenantId: admin.tenantId, status: "ACTIVE" }, include: { user: true }, orderBy: { user: { name: "asc" } }, take: 5000 }),'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              '<label className="label">Existing homeowner link <span className="font-normal text-slate-400">(optional)</span><select className="field" name="homeownerId" defaultValue=""><option value="">Outside renter — no HOAHub profile</option>{homeowners.map((owner) => <option key={owner.id} value={owner.id}>{owner.user.name} · Block {owner.block} Lot {owner.lot}</option>)}</select></label>',
              '<SearchableSelect name="homeownerId" label="Existing homeowner link (optional)" items={homeowners.map((owner) => ({ id: owner.id, label: `${owner.user.name} · Block ${owner.block} Lot ${owner.lot}`, search: `${owner.user.name} block ${owner.block} lot ${owner.lot} ${owner.address}`.toLowerCase() }))} placeholder="Search homeowner name, block or lot" />'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              '<Link href="/admin/collections" className="btn-secondary">Record renter collection</Link>',
              '<Link href="/admin/collections" className="btn-secondary">Record renter payment</Link>'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              '<th>Status</th><th>Allocate collection</th>',
              '<th>Status</th><th>Payment</th>'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              '<select className="field" name="collectionId" required defaultValue=""><option value="" disabled>Select renter receipt</option>{collections.map((collection) => <option key={collection.id} value={collection.id}>{collection.receiptNumber} · {collection.payerName} · {money(collection.available)} available</option>)}</select>',
              '<SearchableSelect name="collectionId" label="Apply existing receipt" items={collections.filter((collection) => (collection.payerType === "RENTER" && Boolean(collection.payerName) && collection.payerName!.trim().toLocaleLowerCase("en-PH") === invoice.renterName.trim().toLocaleLowerCase("en-PH")) || (collection.payerType === "HOMEOWNER" && Boolean(invoice.renterHomeownerId) && collection.homeownerId === invoice.renterHomeownerId)).map((collection) => ({ id: collection.id, label: `${collection.receiptNumber} · ${collection.payerName || invoice.renterName} · ${money(collection.available)} available`, search: `${collection.receiptNumber} ${collection.payerName || invoice.renterName} ${Number(collection.available).toFixed(2)}`.toLowerCase() }))} placeholder="Search receipt number, renter or amount" required />'
          )
          replace_once(
              "app/admin/rentals/page.tsx",
              '<p className="eyebrow">Rental receivables</p><h2 className="text-xl font-black">Invoices & payment reconciliation</h2>',
              '<p className="eyebrow">Rental receivables</p><h2 className="text-xl font-black">Invoices & payment reconciliation</h2><p className="text-sm text-slate-500">Record renter payment creates the official cash receipt. Apply existing receipt links that receipt to the matching rental invoice.</p>'
          )

          # Regression coverage.
          p = Path("tests/unit/rental-management-mvp.test.ts")
          text = p.read_text()
          text = text.replace('const exportRoute = readFileSync("app/admin/reports/export/route.ts", "utf8");\n', 'const exportRoute = readFileSync("app/admin/reports/export/route.ts", "utf8");\nconst financialReport = readFileSync("lib/services/financial-report.ts", "utf8");\nconst reportPage = readFileSync("app/admin/reports/page.tsx", "utf8");\n')
          text += '''\n\ntest("rental deposits stay out of recognized income while remaining cash receipts", () => {\n  assert.match(financialReport, /summarizeRentalSecurityDeposits/);\n  assert.match(financialReport, /recognizedCollectionAmount/);\n  assert.match(financialReport, /rentalSecurityDepositsReceived/);\n  assert.match(reportPage, /Rental security deposits received \\(liability\\)/);\n});\n\ntest("rental homeowner and receipt selectors are searchable at client scale", () => {\n  assert.match(page, /SearchableSelect name="homeownerId"/);\n  assert.match(page, /Search homeowner name, block or lot/);\n  assert.match(page, /SearchableSelect name="collectionId"/);\n  assert.match(page, /Search receipt number, renter or amount/);\n  assert.match(page, /LIMIT 5000/);\n  assert.match(page, /take: 5000/);\n  assert.match(page, /collection\\.payerType === "RENTER"/);\n  assert.match(page, /collection\\.payerType === "HOMEOWNER"/);\n});\n'''
          p.write_text(text)

          # Agent release contract.
          p = Path("Agent.md")
          text = p.read_text()
          text = text.replace("Last updated: 2026-08-22", "Last updated: 2026-08-22")
          marker = "## Hostinger Production Deployment Model\n"
          hotfix = '''## Rental Accounting & Search UX Hotfix — PR #139\n\n- Refundable rental security deposits are cash receipts/liabilities, not recognized income. Financial web/PDF/DOCX reports must subtract only `SECURITY_DEPOSIT`-allocated amounts from Other Income revenue while keeping those amounts in cash receipts as `Rental security deposits received (liability)`.\n- Partial or mixed rental receipts are accounted by allocation amount, not by classifying the whole Collection row.\n- Rental renter onboarding must provide searchable homeowner linking and support the client-scale homeowner directory up to the existing 5,000-row onboarding ceiling.\n- Rental invoice reconciliation must provide a searchable existing-receipt selector, filter eligible receipts to the invoice renter/homeowner before display, and keep server-side payer/tenant/over-allocation validation authoritative.\n- `Record renter payment` is the cash-receipt step; `Apply existing receipt` is reconciliation to an existing rental invoice. Do not collapse these concepts in labels or accounting.\n- `lib/rental-accounting.ts`, `lib/services/financial-report.ts`, `app/admin/reports/page.tsx`, PDF/DOCX report routes, `app/admin/rentals/page.tsx`, and `tests/unit/rental-management-mvp.test.ts` are the principal regression surface for this hotfix.\n\n'''
          if marker not in text:
              raise SystemExit("Agent Hostinger marker not found")
          p.write_text(text.replace(marker, hotfix + marker, 1))
          PY

          rm -f .github/workflows/pr139-rental-report-search-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix rental deposit accounting and searchable selectors"
          git push origin HEAD:fix/rental-report-search-ux
