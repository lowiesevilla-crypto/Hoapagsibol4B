              <section className="card"><h2 className="mb-1 text-lg font-black">Recent rental payment reconciliation</h2><p className="mb-3 text-sm text-slate-500">Each row links an existing HOAHub collection receipt to a rental receivable.</p><div className="table-wrap shadow-none"><table className="data-table"><thead><tr><th>Receipt</th><th>Invoice</th><th>Renter</th><th>Asset</th><th>Charge</th><th>Amount</th><th>Date</th></tr></thead><tbody>{allocations.map((allocation) => <tr key={allocation.id}><td className="font-bold">{allocation.collection.receiptNumber || allocation.collection.id.slice(-8)}</td><td>{allocation.invoice.invoiceNumber}</td><td>{allocation.invoice.agreement.renter.fullName}</td><td>{allocation.invoice.agreement.asset.code}</td><td>{allocation.invoice.chargeType.replaceAll("_", " ")}</td><td className="font-black">{money(allocation.amount)}</td><td>{shortDate(allocation.createdAt)}</td></tr>)}{!allocations.length && <tr><td colSpan={7} className="py-8 text-center text-slate-500">No rental allocations yet.</td></tr>}</tbody></table></div></section>
            </>;
          }
