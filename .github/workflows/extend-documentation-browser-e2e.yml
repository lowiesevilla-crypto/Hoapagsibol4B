name: Extend Documentation Browser UAT

on:
  push:
    branches:
      - feat/complete-documentation-module
    paths:
      - scripts/extend-documentation-browser-e2e.mjs
      - .github/workflows/extend-documentation-browser-e2e.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-documentation-module
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extend document browser coverage
        run: node scripts/extend-documentation-browser-e2e.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test: cover documentation operations in browser UAT"
          git push origin HEAD:feat/complete-documentation-module
