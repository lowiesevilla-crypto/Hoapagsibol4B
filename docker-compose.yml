services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hoa_portal
      MYSQL_USER: hoa_app
      MYSQL_PASSWORD: hoa_local_password
      MYSQL_ROOT_PASSWORD: hoa_local_root_password
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-phoa_local_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - hoa_mysql_data:/var/lib/mysql

volumes:
  hoa_mysql_data:
