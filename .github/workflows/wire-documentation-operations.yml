name: Wire Documentation Operations

on:
  push:
    branches:
      - feat/complete-documentation-module
    paths:
      - scripts/wire-documentation-operations.mjs
      - .github/workflows/wire-documentation-operations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-documentation-module
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire documentation surfaces
        run: node scripts/wire-documentation-operations.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: link documentation operations and guides"
          git push origin HEAD:feat/complete-documentation-module
