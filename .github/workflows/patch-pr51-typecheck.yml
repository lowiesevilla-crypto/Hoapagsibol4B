name: Patch PR 51 typecheck compatibility

on:
  push:
    branches:
      - enhancement/homeowner-multi-account-activation
    paths:
      - .github/workflows/patch-pr51-typecheck.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement/homeowner-multi-account-activation
          fetch-depth: 0

      - name: Patch removed tenant-email unique selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {pattern}")
              file.write_text(updated, encoding="utf-8")

          sub_once(
              "lib/actions/employees.ts",
              r"  const user = await prisma\.user\.upsert\(\{\n    where: \{ tenantId_email: \{ tenantId, email: loginEmail \} \},\n    update: \{\n      name,\n      role: primaryRole,\n      passwordHash: await hash\(password, 12\),\n    \},\n    create: \{\n      tenantId,\n      name,\n      email: loginEmail,\n      role: primaryRole,\n      passwordHash: await hash\(password, 12\),\n    \},\n  \}\);",
              "  const user = await prisma.user.create({\n    data: {\n      tenantId,\n      name,\n      email: loginEmail,\n      role: primaryRole,\n      passwordHash: await hash(password, 12),\n    },\n  });",
          )

          sub_once(
              "scripts/prepare-critical-browser-e2e.ts",
              r"  const user = await prisma\.user\.findUnique\(\{\n    where: \{ tenantId_email: \{ tenantId: primaryTenantId, email: registeredHomeownerEmail \} \},\n    include: \{ homeownerProfile: true \},\n  \}\);",
              "  const user = await prisma.user.findFirst({\n    where: { tenantId: primaryTenantId, email: registeredHomeownerEmail },\n    include: { homeownerProfile: true },\n    orderBy: { createdAt: \\\"desc\\\" },\n  });",
          )
          sub_once(
              "scripts/prepare-critical-browser-e2e.ts",
              r"    where: \{ tenantId_email: \{ tenantId: input\.tenantId, email: input\.email \} \},\n    update: \{\n      id: input\.userId,",
              "    where: { id: input.userId },\n    update: {",
          )

          sub_once(
              "work/create-functional-test-data.ts",
              r"    where: \{ tenantId_email: \{ tenantId: TENANT_ID, email: \"admin@greenmeadows\.test\" \} \},",
              "    where: {\n      id: (\n        await prisma.user.findFirst({\n          where: { tenantId: TENANT_ID, email: \\\"admin@greenmeadows.test\\\", role: Role.ADMIN },\n          select: { id: true },\n          orderBy: { createdAt: \\\"asc\\\" },\n        })\n      )?.id ?? \\\"fixture-admin-user-not-found\\\",\n    },",
          )
          sub_once(
              "work/create-functional-test-data.ts",
              r"      where: \{ tenantId_email: \{ tenantId: TENANT_ID, email: item\.email \} \},",
              "      where: {\n        id: (\n          await prisma.user.findFirst({\n            where: { tenantId: TENANT_ID, email: item.email, name: item.name },\n            select: { id: true },\n            orderBy: { createdAt: \\\"asc\\\" },\n          })\n        )?.id ?? `fixture-homeowner-${item.block}-${item.lot}`,\n      },",
          )

          sub_once(
              "work/create-two-test-homeowners.ts",
              r"      where: \{ tenantId_email: \{ tenantId: TENANT_ID, email: testHomeowner\.email \} \},",
              "      where: {\n        id: (\n          await prisma.user.findFirst({\n            where: { tenantId: TENANT_ID, email: testHomeowner.email, name: testHomeowner.name },\n            select: { id: true },\n            orderBy: { createdAt: \\\"asc\\\" },\n          })\n        )?.id ?? `fixture-homeowner-${testHomeowner.block}-${testHomeowner.lot}`,\n      },",
          )

          targets = [
              "lib/actions/employees.ts",
              "scripts/prepare-critical-browser-e2e.ts",
              "work/create-functional-test-data.ts",
              "work/create-two-test-homeowners.ts",
          ]
          for target in targets:
              if "tenantId_email" in Path(target).read_text(encoding="utf-8"):
                  raise SystemExit(f"Legacy selector remains in {target}")

          Path(".github/workflows/patch-pr51-typecheck.yml").unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/actions/employees.ts scripts/prepare-critical-browser-e2e.ts work/create-functional-test-data.ts work/create-two-test-homeowners.ts .github/workflows/patch-pr51-typecheck.yml
          git diff --cached --check
          git commit -m "fix: replace removed tenant email unique selectors"
          git push origin HEAD:enhancement/homeowner-multi-account-activation
