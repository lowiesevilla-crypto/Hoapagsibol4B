          cat > tests/unit/rental-management-mvp.test.ts <<'TS'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const schemaPath = new URL("../../prisma/schema.prisma", import.meta.url);
          const migrationPath = new URL("../../prisma/migrations/20260822070000_rental_management_mvp/migration.sql", import.meta.url);
          const actionsPath = new URL("../../lib/actions/rentals.ts", import.meta.url);
          const pagePath = new URL("../../app/admin/rentals/page.tsx", import.meta.url);
          const permissionsPath = new URL("../../lib/authorization/permissions.ts", import.meta.url);
          const sidebarPath = new URL("../../components/sidebar-links.ts", import.meta.url);
          const exportPath = new URL("../../app/admin/reports/export/route.ts", import.meta.url);
          const agentPath = new URL("../../Agent.md", import.meta.url);

          test("rental domain keeps external renters profile-optional and tenant-scoped", async () => {
            const [schema, migration] = await Promise.all([readFile(schemaPath, "utf8"), readFile(migrationPath, "utf8")]);
            for (const model of ["RentalAsset", "Renter", "RentalAgreement", "RentalInvoice", "RentalPaymentAllocation"]) assert.match(schema, new RegExp(`model ${model} \\{`));
            assert.match(schema, /homeownerId String\?/);
            assert.match(schema, /enum RentalInvoiceStatus \{[\s\S]*OPEN[\s\S]*PARTIAL[\s\S]*PAID[\s\S]*OVERDUE/);
            assert.match(schema, /enum RentalChargeType \{[\s\S]*RENT[\s\S]*SECURITY_DEPOSIT/);
            assert.match(schema, /collection\s+Collection\s+@relation\(fields: \[tenantId, collectionId\]/);
            assert.match(migration, /FOREIGN KEY \(`tenantId`,`collectionId`\) REFERENCES `Collection`\(`tenantId`,`id`\)/);
          });

          test("rental payment allocation reconciles existing collections without duplicating cash", async () => {
            const [actions, report] = await Promise.all([readFile(actionsPath, "utf8"), readFile(exportPath, "utf8")]);
            assert.match(actions, /type: CollectionType\.OTHER, refundable: false/);
            assert.match(actions, /Allocation exceeds the remaining amount on this collection receipt/);
            assert.match(actions, /Allocation exceeds the rental invoice balance/);
            assert.match(actions, /rentalPaymentAllocation\.create/);
            assert.match(actions, /RentalInvoiceStatus\.PAID/);
            assert.match(report, /Refundable rental deposit liability/);
            assert.match(report, /Rental income/);
          });

          test("rental UI, permissions, navigation, and Agent contract are wired", async () => {
            const [page, permissions, sidebar, agent] = await Promise.all([readFile(pagePath, "utf8"), readFile(permissionsPath, "utf8"), readFile(sidebarPath, "utf8"), readFile(agentPath, "utf8")]);
            assert.match(page, /title="Rental Management"/);
            assert.match(page, /Monthly rental billing/);
            assert.match(page, /Allocate collection receipt/);
            assert.match(permissions, /RENTALS_READ: "rentals\.read"/);
            assert.match(permissions, /RENTALS_MANAGE: "rentals\.manage"/);
            assert.match(sidebar, /href: "\/admin\/rentals"/);
            assert.match(agent, /## Rental Management MVP — PR #138/);
            assert.match(agent, /security deposits remain liabilities/);
          });
          TS

          rm -f .github/workflows/pr138-rental-mvp-bootstrap.yml

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Focused rental tests
        run: node --import tsx --test tests/unit/rental-management-mvp.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rental MVP changes to commit."
            exit 0
          fi
          git commit -m "feat(rentals): add rental management MVP"
          git push origin HEAD:feature/rental-management-mvp
