name: Repair StandardTable Wrappers

on:
  push:
    branches: [codex/standard-table-org-edit-fix]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip wrapper-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/standard-table-org-edit-fix
          fetch-depth: 0
      - name: Repair malformed wrapper order
        run: node scripts/repair-standard-table-wrappers.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No wrapper repairs required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "fix(ui): repair StandardTable wrapper nesting [skip wrapper-repair]"
          git push origin HEAD:codex/standard-table-org-edit-fix
