            const occupied = assets.filter((asset) => asset.status === "OCCUPIED").length;
            const outstandingRent = invoices.filter((invoice) => invoice.chargeType === "RENT" && Number(invoice.balance) > 0).reduce((sum, invoice) => sum + Number(invoice.balance), 0);
            const overdue = invoices.filter((invoice) => Number(invoice.balance) > 0 && invoice.dueDate < today).length;
