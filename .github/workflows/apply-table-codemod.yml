name: Apply StandardTable Codemod

on:
  push:
    branches: [codex/standard-table-org-edit-fix]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip table-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/standard-table-org-edit-fix
          fetch-depth: 0
      - name: Apply StandardTable codemod
        run: node scripts/apply-standard-table-codemod.mjs
      - name: Commit codemod result
        run: |
          if git diff --quiet; then
            echo "No codemod changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "refactor(ui): standardize existing data tables [skip table-codemod]"
          git push origin HEAD:codex/standard-table-org-edit-fix
