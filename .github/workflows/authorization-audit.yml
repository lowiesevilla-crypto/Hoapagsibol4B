name: Authorization Surface Audit

on:
  push:
    branches:
      - feat/complete-granular-authorization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit residual role authorization
        run: node scripts/audit-authorization-surface.mjs
