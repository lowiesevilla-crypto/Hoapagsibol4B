name: HOAHub Firefox Critical Flow

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: hoa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox-critical-flow:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hoa_portal
          MYSQL_USER: hoa_app
          MYSQL_PASSWORD: hoa_ci_password
          MYSQL_ROOT_PASSWORD: hoa_ci_root_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -phoa_ci_root_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://hoa_app:hoa_ci_password@127.0.0.1:3306/hoa_portal
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3000/api
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      CRON_SECRET: ci-only-cron-secret-with-at-least-32-characters
      STORAGE_ROOT: /tmp/hoahub-storage
      SEED_SYSTEM_ADMIN_EMAIL: ci-system@example.invalid
      SEED_SYSTEM_ADMIN_PASSWORD: CI-Temporary-Password-2026!
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_COVERAGE_YEAR: "2099"
      E2E_COVERAGE_MONTH: "1"
      AI_RUNTIME_ENABLED: "true"
      AI_PROVIDER_MODE: mock
      HOAHUB_E2E_BROWSER: firefox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm build
      - name: Require Mozilla Firefox
        shell: bash
        run: |
          set -Eeuo pipefail
          FIREFOX_PATH="$(command -v firefox || command -v firefox-esr || true)"
          if [ -z "$FIREFOX_PATH" ] || [ ! -x "$FIREFOX_PATH" ]; then
            echo "::error::Mozilla Firefox is not installed on this GitHub-hosted runner. Refusing browser fallback because it would not prove Firefox compatibility."
            exit 1
          fi
          echo "FIREFOX_BIN=$FIREFOX_PATH" >> "$GITHUB_ENV"
          "$FIREFOX_PATH" --version
      - name: Run non-destructive Firefox critical-flow evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm e2e:prepare
          pnpm start > /tmp/hoa-firefox-next.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            pnpm e2e:cleanup || true
            echo "--- HOAHub Firefox server log ---"
            cat /tmp/hoa-firefox-next.log || true
          }
          trap cleanup EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          set +e
          node --import ./tests/e2e/safe-browser-context-cleanup.mjs tests/e2e/wcag-critical-flow.mjs 2>&1 | tee /tmp/hoa-firefox-e2e.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          exit "$TEST_STATUS"
      - name: Upload Firefox failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hoa-firefox-failure-diagnostics
          path: |
            /tmp/hoa-firefox-e2e.log
            /tmp/hoa-firefox-next.log
          if-no-files-found: warn
          retention-days: 3
