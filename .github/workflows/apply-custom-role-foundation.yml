name: Apply Custom Role Foundation

on:
  push:
    branches:
      - feat/complete-granular-authorization
    paths:
      - scripts/apply-custom-role-foundation.mjs
      - .github/workflows/apply-custom-role-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-granular-authorization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authorization foundation
        run: node scripts/apply-custom-role-foundation.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add tenant custom roles and authorization snapshots"
          git push origin HEAD:feat/complete-granular-authorization
