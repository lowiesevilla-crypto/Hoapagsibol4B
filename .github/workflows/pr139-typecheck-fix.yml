name: PR139 typed rental report fix

on:
  push:
    branches:
      - fix/rental-report-search-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rental-report-search-ux
          fetch-depth: 0
      - name: Apply typed tenant-scoped rental accounting fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          page = "app/admin/reports/page.tsx"
          replace_once(page,
              'import { Download, FileText, HandCoins, ReceiptText, TrendingUp, WalletCards } from "lucide-react";\n',
              'import { Download, FileText, HandCoins, ReceiptText, TrendingUp, WalletCards } from "lucide-react";\nimport { Prisma, Role } from "@prisma/client";\n')
          replace_once(page,
              'import { PageHeader } from "@/components/page-header";\n',
              'import { PageHeader } from "@/components/page-header";\nimport { requireUser } from "@/lib/auth";\n')
          replace_once(page,
              'import { collectionLabel, inputDate, money, monthLabel, shortDate } from "@/lib/utils";\n\nexport default async function ReportsPage',
              'import { collectionLabel, inputDate, money, monthLabel, shortDate } from "@/lib/utils";\n\ntype RentalAllocationAccountingRow = { collectionId: string; amount: Prisma.Decimal | number | string; chargeType: string };\n\nexport default async function ReportsPage')
          replace_once(page,
              '  const filters = await searchParams;\n',
              '  const user = await requireUser(Role.ADMIN);\n  const filters = await searchParams;\n')
          replace_once(page,
              '    prisma.rentalPaymentAllocation.findMany({ where: { collection: { collectionDate: range } }, include: { invoice: true }, take: 5000 }),',
              '''    prisma.$queryRaw<RentalAllocationAccountingRow[]>(Prisma.sql`\n      SELECT a.collectionId,a.amount,i.chargeType\n      FROM RentalPaymentAllocation a\n      JOIN RentalInvoice i ON i.tenantId=a.tenantId AND i.id=a.invoiceId\n      JOIN Collection c ON c.tenantId=a.tenantId AND c.id=a.collectionId\n      WHERE a.tenantId=${user.tenantId} AND c.collectionDate>=${from} AND c.collectionDate<=${to}\n      LIMIT 5000\n    `),''')
          replace_once(page,
              'rentalAllocations.map((item) => ({ collectionId: item.collectionId, amount: item.amount, chargeType: item.invoice.chargeType }))',
              'rentalAllocations.map((item) => ({ collectionId: item.collectionId, amount: item.amount, chargeType: item.chargeType }))')

          service = "lib/services/financial-report.ts"
          replace_once(service,
              'import { prisma } from "@/lib/db";\n',
              'import { Prisma } from "@prisma/client";\nimport { prisma } from "@/lib/db";\n')
          replace_once(service,
              'import { collectionLabel, inputDate } from "@/lib/utils";\n\nexport async function getFinancialReport(fromInput?: string | null, toInput?: string | null) {',
              'import { collectionLabel, inputDate } from "@/lib/utils";\n\ntype RentalAllocationAccountingRow = { collectionId: string; amount: Prisma.Decimal | number | string; chargeType: string };\n\nexport async function getFinancialReport(tenantId: string, fromInput?: string | null, toInput?: string | null) {')
          replace_once(service,
              '    prisma.rentalPaymentAllocation.findMany({ where: { collection: { collectionDate: range } }, include: { invoice: true }, take: 5000 }),',
              '''    prisma.$queryRaw<RentalAllocationAccountingRow[]>(Prisma.sql`\n      SELECT a.collectionId,a.amount,i.chargeType\n      FROM RentalPaymentAllocation a\n      JOIN RentalInvoice i ON i.tenantId=a.tenantId AND i.id=a.invoiceId\n      JOIN Collection c ON c.tenantId=a.tenantId AND c.id=a.collectionId\n      WHERE a.tenantId=${tenantId} AND c.collectionDate>=${from} AND c.collectionDate<=${to}\n      LIMIT 5000\n    `),''')
          replace_once(service,
              'rentalAllocations.map((item) => ({ collectionId: item.collectionId, amount: item.amount, chargeType: item.invoice.chargeType }))',
              'rentalAllocations.map((item) => ({ collectionId: item.collectionId, amount: item.amount, chargeType: item.chargeType }))')

          for route in ["app/admin/reports/pdf/route.ts", "app/admin/reports/docx/route.ts"]:
              replace_once(route,
                  'getFinancialReport(url.searchParams.get("from"), url.searchParams.get("to"))',
                  'getFinancialReport(user.tenantId, url.searchParams.get("from"), url.searchParams.get("to"))')

          agent = Path("Agent.md")
          text = agent.read_text()
          marker = "## Mandatory Agent.md Maintenance"
          note = "\n- PR #139 rental report hotfix uses explicit tenant-scoped raw SQL for RentalPaymentAllocation because rental MVP tables are migration-backed and not Prisma model delegates; financial report callers pass authenticated tenantId.\n"
          if note.strip() not in text:
              text = text.replace(marker, note + "\n" + marker, 1)
              agent.write_text(text)
          PY
          rm -f .github/workflows/pr139-typecheck-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/reports/page.tsx lib/services/financial-report.ts app/admin/reports/pdf/route.ts app/admin/reports/docx/route.ts Agent.md .github/workflows/pr139-typecheck-fix.yml
          git commit -m "fix: type and scope rental report accounting"
          git push origin HEAD:fix/rental-report-search-ux
