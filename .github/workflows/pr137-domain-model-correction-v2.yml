name: PR137 Domain Model Correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct-domain-model:
    if: github.event.pull_request.head.ref == 'fix/collections-flexible-payers' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/collections-flexible-payers
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply first-class flexible payer correction
        run: python3 scripts/pr137-correct.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Focused PR137 regression
        run: pnpm exec tsx --test tests/unit/flexible-collection-payers-surface.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Commit corrected implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(collections): use first-class flexible payer model"
          git push origin HEAD:fix/collections-flexible-payers
