name: One-time homeowner schema sync

on:
  push:
    branches:
      - enhancement/homeowner-multi-account-activation

permissions:
  contents: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhancement/homeowner-multi-account-activation
      - name: Align Prisma schema with applied migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("prisma/schema.prisma")
          source = path.read_text()
          old = "  @@unique([tenantId, email])"
          new = "  @@index([tenantId, email, active])"
          if old in source:
              path.write_text(source.replace(old, new, 1))
              print("Updated User email identity index in Prisma schema.")
          elif new in source:
              print("Prisma schema is already aligned.")
          else:
              raise SystemExit("Expected User email constraint was not found.")
          PY
      - name: Commit schema alignment
        shell: bash
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No schema change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "fix(db): align Prisma schema with multi-account email index"
          git push origin HEAD:enhancement/homeowner-multi-account-activation
