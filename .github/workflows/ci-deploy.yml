name: HOAHub MySQL CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: hoa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hoa_portal
          MYSQL_USER: hoa_app
          MYSQL_PASSWORD: hoa_ci_password
          MYSQL_ROOT_PASSWORD: hoa_ci_root_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -phoa_ci_root_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://hoa_app:hoa_ci_password@127.0.0.1:3306/hoa_portal
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3000/api
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      CRON_SECRET: ci-only-cron-secret-with-at-least-32-characters
      STORAGE_ROOT: /tmp/hoahub-storage
      SEED_SYSTEM_ADMIN_EMAIL: ci-system@example.invalid
      SEED_SYSTEM_ADMIN_PASSWORD: CI-Temporary-Password-2026!
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_COVERAGE_YEAR: "2099"
      E2E_COVERAGE_MONTH: "1"
      AI_RUNTIME_ENABLED: "true"
      AI_PROVIDER_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - name: Unit test suite
        run: pnpm test
      - name: Database finance integration suite
        run: pnpm test:integration
      - name: Critical verification suite
        run: pnpm test:critical
      - run: pnpm typecheck
      - run: pnpm build
      - name: Production smoke and critical browser suite
        run: |
          pnpm e2e:prepare
          pnpm start > /tmp/hoa-next.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            pnpm e2e:cleanup || true
            echo "--- HOAHub server log ---"
            cat /tmp/hoa-next.log || true
          }
          trap cleanup EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          pnpm smoke:production -- http://127.0.0.1:3000
          pnpm test:e2e

  deploy-production:
    name: Deploy to Hostinger production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
      HOSTINGER_APP_URL: ${{ secrets.HOSTINGER_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in HOSTINGER_HOST HOSTINGER_PORT HOSTINGER_USER HOSTINGER_SSH_PRIVATE_KEY HOSTINGER_APP_PATH HOSTINGER_APP_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for the production environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure deployment SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["HOSTINGER_SSH_PRIVATE_KEY"].strip().lstrip("\ufeff")
          if (key.startswith('"') and key.endswith('"')) or (key.startswith("'") and key.endswith("'")):
              key = key[1:-1].strip()
          key = key.replace("\\r\\n", "\n").replace("\\n", "\n")
          key = key.replace("\r\n", "\n").replace("\r", "\n")
          Path(os.environ["HOME"], ".ssh", "hoahub_hostinger").write_text(key + "\n", encoding="utf-8")
          PY
          chmod 600 "$HOME/.ssh/hoahub_hostinger"
          ssh-keygen -y -f "$HOME/.ssh/hoahub_hostinger" > /dev/null
          ssh-keyscan -p "$HOSTINGER_PORT" -H "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload immutable release
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_TARGET="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          RELEASE_DIR="${HOSTINGER_APP_PATH}/releases/${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/hoahub_hostinger" -p "$HOSTINGER_PORT" "$SSH_TARGET" "mkdir -p '$RELEASE_DIR'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.next/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude 'public/uploads/' \
            -e "ssh -i $HOME/.ssh/hoahub_hostinger -p $HOSTINGER_PORT" \
            ./ "$SSH_TARGET:$RELEASE_DIR/"

      - name: Activate release on Hostinger
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_TARGET="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          RELEASE_DIR="${HOSTINGER_APP_PATH}/releases/${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/hoahub_hostinger" -p "$HOSTINGER_PORT" "$SSH_TARGET" \
            "APP_ROOT='$HOSTINGER_APP_PATH' RELEASE_ID='$GITHUB_SHA' bash '$RELEASE_DIR/scripts/deploy-hostinger.sh'"

      - name: Verify public production health
        shell: bash
        run: |
          set -Eeuo pipefail
          HEALTH_URL="${HOSTINGER_APP_URL%/}/api/health"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$HEALTH_URL" > /dev/null; then
              echo "Production health check passed: $HEALTH_URL"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production health check failed: $HEALTH_URL"
          exit 1
