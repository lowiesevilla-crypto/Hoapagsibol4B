name: HOAHub MySQL CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: hoa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hoa_portal
          MYSQL_USER: hoa_app
          MYSQL_PASSWORD: hoa_ci_password
          MYSQL_ROOT_PASSWORD: hoa_ci_root_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -phoa_ci_root_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://hoa_app:hoa_ci_password@127.0.0.1:3306/hoa_portal
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3000/api
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      CRON_SECRET: ci-only-cron-secret-with-at-least-32-characters
      STORAGE_ROOT: /tmp/hoahub-storage
      SEED_SYSTEM_ADMIN_EMAIL: ci-system@example.invalid
      SEED_SYSTEM_ADMIN_PASSWORD: CI-Temporary-Password-2026!
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_COVERAGE_YEAR: "2099"
      E2E_COVERAGE_MONTH: "1"
      AI_RUNTIME_ENABLED: "true"
      AI_PROVIDER_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - name: Unit test suite
        run: pnpm test
      - name: Database finance integration suite
        run: pnpm test:integration
      - name: Verify auth navigation and cache recovery
        run: pnpm run verify:auth-navigation-cache
      - name: Verify complaint management
        run: pnpm run verify:complaint-management
      - name: Verify document fee payment
        run: pnpm run verify:document-fee-payment
      - name: Verify homeowner mobile shell
        run: pnpm run verify:homeowner-mobile-shell
      - name: Verify homeowner mobile dashboard
        run: pnpm run verify:homeowner-mobile-dashboard
      - name: Verify homeowner mobile community
        run: pnpm run verify:homeowner-mobile-community
      - name: Verify homeowner mobile payments
        run: pnpm run verify:homeowner-mobile-payments
      - name: Verify homeowner mobile requests
        run: pnpm run verify:homeowner-mobile-requests
      - name: Verify homeowner mobile hardening
        run: pnpm run verify:homeowner-mobile-hardening
      - name: Verify homeowner PWA
        run: pnpm run verify:homeowner-pwa
      - run: pnpm typecheck
      - run: pnpm build
      - name: Prepare controlled Chromium for browser suites
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROMIUM_PATH="$(node --input-type=module -e 'import chromium from "@sparticuz/chromium"; process.stdout.write(await chromium.executablePath())')"
          if [ ! -x "$CHROMIUM_PATH" ]; then
            echo "::error::Packaged Chromium executable was not prepared correctly."
            exit 1
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          echo "Using repository-controlled Chromium for browser verification."
      - name: Production smoke and critical browser suite
        run: |
          set -Eeuo pipefail
          pnpm e2e:prepare
          pnpm start > /tmp/hoa-next.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            pnpm e2e:cleanup || true
            echo "--- HOAHub server log ---"
            cat /tmp/hoa-next.log || true
          }
          trap cleanup EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          node scripts/run-critical-browser-ci.mjs

      - name: Upload critical browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/hoahub-ci-suite-status.log
            /tmp/hoahub-ci-suite-output.log
          if-no-files-found: warn
          retention-days: 7

  deploy-production:
    name: Verify Hostinger managed production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      HOSTINGER_APP_URL: ${{ secrets.HOSTINGER_APP_URL }}
    steps:
      - name: Validate managed deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${HOSTINGER_APP_URL:-}" ]; then
            echo "::error::HOSTINGER_APP_URL is not configured for the production environment."
            exit 1
          fi

      - name: Wait for Hostinger GitHub auto-deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_SHA="${GITHUB_SHA:0:12}"
          RELEASE_URL="${HOSTINGER_APP_URL%/}/release.txt"
          echo "Waiting for Hostinger managed deployment of $EXPECTED_SHA"

          for attempt in {1..120}; do
            LIVE_SHA="$(curl --fail --silent --show-error --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "${RELEASE_URL}?expected=${EXPECTED_SHA}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n' || true)"

            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "Hostinger is serving the expected release: $LIVE_SHA"
              exit 0
            fi

            if [ -n "$LIVE_SHA" ]; then
              echo "Hostinger currently serves $LIVE_SHA; waiting for $EXPECTED_SHA (attempt $attempt/120)."
            else
              echo "Release marker not available yet (attempt $attempt/120)."
            fi
            sleep 5
          done

          echo "::error::Hostinger did not publish expected release $EXPECTED_SHA within 10 minutes."
          exit 1

      - name: Verify public production health
        shell: bash
        run: |
          set -Eeuo pipefail
          HEALTH_URL="${HOSTINGER_APP_URL%/}/api/health"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "${HEALTH_URL}?attempt=${attempt}" > /dev/null; then
              echo "Production health check passed: $HEALTH_URL"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production health check failed: $HEALTH_URL"
          exit 1
